name: swarm-verify
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  verify:
    if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: moonrunnerkc/swarm-verify@dc37da9b9a8bdf83ddab4e884475b96e2d1b2b72 # v1.3.0
        with:
          install: true
